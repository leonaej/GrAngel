<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entering GrAngel World</title>
<style>
  :root{
    --sky-top:#bfe3ec; --sky-low:#e9f4ec;
    --grass:#7fae6a; --grass-dk:#5f8f52;
    --heart:#e26d6d; --ink:#5b4a42; --panel:#fbf6ec;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:"Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--sky-low); overflow:hidden; }
  #stage{ position:relative; width:100vw; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:16px; text-align:center;
    background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-low) 62%); }
  .ground{ position:absolute; left:0; right:0; bottom:0; height:28%; background:linear-gradient(to bottom,var(--grass) 0%,var(--grass-dk) 100%); border-top-left-radius:40% 60px; border-top-right-radius:40% 60px; }

  /* Placeholder entry screen — swap in the real welcome/intro here later. */
  #grangel{ width:140px; height:150px; object-fit:contain; filter:drop-shadow(0 10px 8px rgba(0,0,0,.15)); animation:hover 4s ease-in-out infinite; position:relative; }
  @keyframes hover{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-14px); } }
  h1{ margin:0; font-size:clamp(28px,6vw,44px); position:relative; }
  p{ margin:0; font-size:17px; opacity:.8; position:relative; }
  #enter{ position:relative; margin-top:6px; background:var(--heart); color:#fff; font-weight:700; font-size:18px; padding:14px 28px; border-radius:999px; text-decoration:none; box-shadow:0 6px 14px rgba(0,0,0,.2); transition:transform .15s ease; }
  #enter:hover{ transform:translateY(-2px); }
  #enter:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce){ #grangel{ animation:none; } }
</style>
</head>
<body>
  <div id="stage">
    <div class="ground"></div>
    <img id="grangel" src="assets/images/gram_grangel.png" alt="GrAngel, a friendly waving heart" />
    <h1>GrAngel World</h1>
    <p>A calm, cozy village is waiting for you. 💛</p>
    <a id="enter" href="pages/home.html">Enter GrAngel World →</a>
  </div>
</body>
</html>
