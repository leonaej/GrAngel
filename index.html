<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GrAngel World Village</title>
<style>
  :root{
    --sky-top:#bfe3ec; --sky-low:#e9f4ec;
    --grass:#7fae6a; --grass-dk:#5f8f52;
    --soil:#d8b78a; --water:#9ed4d6; --water-dk:#7cc0c4;
    --wall:#efe4d2; --roof:#c98d84; --wood:#b98a5e;
    --leaf:#7fb06a; --leaf-dk:#6a9a58;
    --bloom-a:#d98fb0; --bloom-b:#b79ad6;
    --heart:#e26d6d; --ink:#5b4a42; --panel:#fbf6ec;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:"Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--sky-low); overflow:hidden; }
  #stage{ position:relative; width:100vw; height:100vh; overflow:hidden; }

  /* soft fade-in when arriving on this page */
  #stage{ animation:pagein .5s ease; }
  @keyframes pagein{ from{ opacity:0; } to{ opacity:1; } }

  .sky{ position:absolute; inset:0; background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-low) 62%); }
  .cloud{ position:absolute; top:8%; width:160px; height:52px; background:#fff; opacity:.75; border-radius:50px; filter:blur(1px); animation:drift 60s linear infinite; }
  .cloud::before,.cloud::after{ content:""; position:absolute; background:#fff; border-radius:50%; }
  .cloud::before{ width:70px; height:70px; top:-28px; left:24px; }
  .cloud::after{ width:52px; height:52px; top:-18px; left:86px; }
  .cloud.c2{ top:16%; transform:scale(.7); animation-duration:80s; animation-delay:-20s; opacity:.6; }
  .cloud.c3{ top:5%; transform:scale(.9); animation-duration:100s; animation-delay:-50s; opacity:.5; }
  @keyframes drift{ from{ left:-200px; } to{ left:110vw; } }

  .ground{ position:absolute; left:0; right:0; bottom:0; height:52%; background:linear-gradient(to bottom,var(--grass) 0%,var(--grass-dk) 100%); border-top-left-radius:40% 60px; border-top-right-radius:40% 60px; }

  /* Low bushes, scattered just above the bare grass — placed right after .ground in the
     markup (and given no z-index) so everything else (portals, trees, the cottage, the
     player) naturally sits in front of them, never behind. */
  .bush{ position:absolute; border-radius:50% 50% 45% 45%; background:radial-gradient(circle at 35% 28%, var(--leaf) 0%, var(--leaf-dk) 100%); box-shadow:inset -6px -6px 0 rgba(0,0,0,.1); }
  .bush.b1{ width:64px; height:40px; left:2%; bottom:10%; }
  .bush.b2{ width:46px; height:30px; left:16%; bottom:6%; }
  .bush.b3{ width:70px; height:44px; left:37%; bottom:5%; }
  .bush.b4{ width:52px; height:34px; right:14%; bottom:8%; }
  .bush.b5{ width:60px; height:38px; right:3%; bottom:6%; }
  .bush.b6{ width:40px; height:26px; left:58%; bottom:6%; }

  .pond{ position:absolute; bottom:23%; left:6%; width:210px; height:92px; background:radial-gradient(ellipse at 40% 35%,var(--water) 0%,var(--water-dk) 100%); border-radius:50%; box-shadow:inset 0 4px 8px rgba(255,255,255,.35); overflow:hidden; }
  .pond .ripple{ position:absolute; inset:0; border-radius:50%; border:2px solid rgba(255,255,255,.5); animation:ripple 5s ease-out infinite; }
  @keyframes ripple{ 0%{ transform:scale(.4); opacity:.7; } 100%{ transform:scale(1); opacity:0; } }
  /* --swim (how far the duck paddles) is set by placePond() to fit the pond's width */
  .duck{ position:absolute; width:40px; top:28%; left:14px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.15)); animation:duckSwim 10s ease-in-out infinite; }
  @keyframes duckSwim{
    0%{ transform:translateX(0) scaleX(1); }
    45%{ transform:translateX(var(--swim,120px)) scaleX(1); }
    50%{ transform:translateX(var(--swim,120px)) scaleX(-1); }
    95%{ transform:translateX(0) scaleX(-1); }
    100%{ transform:translateX(0) scaleX(1); }
  }

  /* Roads — 5 brick roads fanning out from a little round plaza at the cottage's
     doorstep, each leading to one of Home's direct connections on the map. Drawn
     into the #roads SVG by buildRoads() (same perspective brick construction as
     Creativity Cottage's road), with flowers dotted along the edges and a wooden
     signpost beside each one. Walking to a road's far end shows a "Go to…" button;
     clicking a signpost goes there too. Rebuilt on resize. */
  #roads{ position:absolute; inset:0; pointer-events:none; }
  .roadsign{ position:absolute; width:10px; height:62px; transform:translate(-50%,-100%); z-index:3; cursor:pointer; transition:transform .2s ease; }
  .roadsign:hover, .roadsign.near{ transform:translate(-50%,calc(-100% - 4px)); }
  .roadsign .post{ position:absolute; bottom:0; left:0; width:10px; height:100%; background:#8a6640; border-radius:3px; box-shadow:0 3px 4px rgba(0,0,0,.2); }
  .roadsign .plank{ position:absolute; top:0; left:50%; transform:translateX(-50%) rotate(-3deg); background:var(--wood); color:#fff8ec; font-weight:700; font-size:13px; padding:6px 11px; border-radius:5px; box-shadow:0 4px 8px rgba(0,0,0,.2); white-space:nowrap; display:flex; align-items:center; gap:5px; }
  .roadsign:focus-visible{ outline:none; } .roadsign:focus-visible .plank{ outline:3px solid var(--heart); outline-offset:2px; }

  #roadPrompt{ position:absolute; transform:translate(-50%,-100%); background:var(--heart); color:#fff; border:none; font-weight:700; font-size:14.5px; padding:10px 18px; border-radius:999px; box-shadow:0 6px 14px rgba(0,0,0,.2); cursor:pointer; opacity:0; pointer-events:none; transition:opacity .2s ease; white-space:nowrap; z-index:12; }
  #roadPrompt.show{ opacity:1; pointer-events:auto; }
  #roadPrompt:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }

  #toast{ position:absolute; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--panel); color:var(--ink); padding:12px 20px; border-radius:16px; box-shadow:0 10px 24px rgba(0,0,0,.2); font-size:15px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease; z-index:30; text-align:center; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .tree{ position:absolute; width:120px; height:150px; }
  .tree .trunk{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:20px; height:56px; background:var(--wood); border-radius:6px; }
  .tree .canopy{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:110px; background:radial-gradient(circle at 40% 35%,var(--leaf) 0%,var(--leaf-dk) 100%); border-radius:50% 50% 46% 46%; box-shadow:inset -8px -6px 0 rgba(0,0,0,.06); }
  .tree.t1{ left:4%; bottom:34%; transform:scale(1.1); }
  .tree.t2{ right:6%; bottom:30%; transform:scale(1.35); }
  .tree.t3{ right:24%; bottom:40%; transform:scale(.8); }

  /* The village cottage — centered, and built the same cozy, fully-connected way as
     Creativity Cottage's exterior (a fascia trim seams the roof to the walls, instead
     of the old version where the roof floated above the body with a visible gap). */
  #cottage{ position:absolute; left:50%; bottom:30%; transform:translateX(-50%); width:280px; height:240px; }
  #cottage .chimney{ position:absolute; top:10px; right:58px; width:24px; height:44px; background:var(--wood); border-radius:3px; }
  #cottage .chimney::before{ content:""; position:absolute; top:-5px; left:-4px; right:-4px; height:8px; background:var(--wood); border-radius:3px; }
  #cottage .roof{ position:absolute; top:0; left:-28px; width:336px; height:112px; background:linear-gradient(160deg,var(--roof) 0%,#b97a72 100%); clip-path:polygon(50% 4%,97% 92%,86% 100%,14% 100%,3% 92%); }
  #cottage .fascia{ position:absolute; top:98px; left:-12px; width:304px; height:13px; background:var(--wood); border-radius:7px; box-shadow:0 3px 0 rgba(0,0,0,.08); }
  #cottage .body{ position:absolute; top:105px; left:14px; width:252px; height:120px; background:var(--wall); border-radius:0 0 18px 18px; box-shadow:inset 0 -10px 0 rgba(0,0,0,.05); }
  #cottage .foundation{ position:absolute; bottom:0; left:14px; width:252px; height:14px; background:var(--wood); opacity:.5; border-radius:0 0 9px 9px; }
  #cottage .window{ position:absolute; top:140px; width:42px; height:42px; border-radius:50%; background:var(--sky-top); border:5px solid var(--wood); box-shadow:inset 0 0 0 3px #fff; }
  #cottage .window::before, #cottage .window::after{ content:""; position:absolute; background:var(--wood); }
  #cottage .window::before{ left:50%; top:0; bottom:0; width:3px; transform:translateX(-50%); }
  #cottage .window::after{ top:50%; left:0; right:0; height:3px; transform:translateY(-50%); }
  #cottage .window.wL{ left:38px; } #cottage .window.wR{ right:38px; }
  #cottage .flowerbox{ position:absolute; top:184px; width:54px; height:13px; background:var(--wood); display:flex; align-items:flex-end; justify-content:center; gap:3px; padding-bottom:3px; border-radius:3px; }
  #cottage .flowerbox.fbL{ left:31px; } #cottage .flowerbox.fbR{ right:31px; }
  #cottage .flowerbox .flower{ width:9px; height:9px; } #cottage .flowerbox .flower::after{ display:none; }
  #cottage .door{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:58px; height:90px; background:var(--wood); border-radius:30px 30px 0 0; box-shadow:inset 0 0 0 3px rgba(255,255,255,.1); }
  #cottage .door::after{ content:""; position:absolute; right:8px; top:44px; width:6px; height:6px; border-radius:50%; background:#f2d9a8; }

  .flowers{ position:absolute; display:flex; gap:6px; }
  .flower{ width:12px; height:12px; border-radius:50%; position:relative; }
  .flower::after{ content:""; position:absolute; left:4px; top:12px; width:3px; height:14px; background:var(--leaf-dk); border-radius:2px; }
  .f-a{ background:var(--bloom-a); } .f-b{ background:var(--bloom-b); } .f-c{ background:#e7c877; }
  .flowers.fl1{ left:30%; bottom:20%; } .flowers.fl2{ left:60%; bottom:14%; } .flowers.fl3{ left:18%; bottom:26%; }

  #grangel{ position:absolute; left:38%; bottom:34%; width:110px; height:120px; object-fit:contain; animation:hover 4s ease-in-out infinite; cursor:pointer; filter:drop-shadow(0 10px 8px rgba(0,0,0,.15)); z-index:5; pointer-events:auto; }
  @keyframes hover{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-14px); } }
  #grangel-shadow{ position:absolute; left:38%; bottom:32%; width:70px; height:16px; margin-left:20px; background:rgba(0,0,0,.18); border-radius:50%; filter:blur(3px); animation:shadowpulse 4s ease-in-out infinite; z-index:4; }
  @keyframes shadowpulse{ 0%,100%{ transform:scale(1); opacity:.35; } 50%{ transform:scale(.8); opacity:.22; } }

  #bubble{ position:absolute; left:46%; bottom:52%; background:var(--panel); color:var(--ink); padding:10px 14px; border-radius:16px; font-size:15px; max-width:200px; box-shadow:0 6px 14px rgba(0,0,0,.12); opacity:0; transform:translateY(6px) scale(.96); transition:opacity .3s ease,transform .3s ease; pointer-events:none; z-index:6; }
  #bubble.show{ opacity:1; transform:translateY(0) scale(1); }
  #bubble::after{ content:""; position:absolute; left:22px; bottom:-8px; border:8px solid transparent; border-top-color:var(--panel); }

  .heart{ position:absolute; width:16px; height:16px; opacity:0; background:var(--heart); transform:rotate(45deg); z-index:6; pointer-events:none; }
  .heart::before,.heart::after{ content:""; position:absolute; width:16px; height:16px; background:var(--heart); border-radius:50%; }
  .heart::before{ top:-8px; left:0; } .heart::after{ left:-8px; top:0; }
  @keyframes floatup{ 0%{ opacity:0; transform:translateY(0) rotate(45deg) scale(.6); } 20%{ opacity:1; } 100%{ opacity:0; transform:translateY(-120px) rotate(45deg) scale(1); } }

  #topbar{ position:absolute; top:16px; left:16px; right:16px; z-index:20; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  #tag{ background:var(--panel); padding:8px 14px; border-radius:14px; font-size:14px; box-shadow:0 3px 8px rgba(0,0,0,.12); }
  #tag b{ color:var(--heart); }
  .btnrow{ display:flex; gap:8px; }
  .btnrow a, .btnrow button{ background:var(--panel); border:none; color:var(--ink); height:44px; padding:0 14px; border-radius:14px; font-size:15px; box-shadow:0 3px 8px rgba(0,0,0,.12); cursor:pointer; transition:transform .15s ease; display:flex; align-items:center; gap:6px; text-decoration:none; }
  .btnrow a:hover, .btnrow button:hover{ transform:translateY(-2px); }
  .btnrow a:focus-visible, .btnrow button:focus-visible{ outline:3px solid var(--heart); outline-offset:2px; }
  .icon-btn{ width:44px; justify-content:center; padding:0; }

  body.reduced .cloud,body.reduced #grangel,body.reduced .pond .ripple{ animation:none; }
  body.reduced #grangel-shadow{ animation:none; opacity:.28; }
  body.reduced #stage{ animation:none; }

  @media (max-width:640px){ #grangel,#grangel-shadow{ left:32%; } #bubble{ left:40%; } }

  /* This wrapper spans the whole stage (so its transform can move everything inside
     together) — pointer-events:none keeps that invisible full-screen box from
     swallowing clicks meant for things underneath it; grangel opts back in below. */
  #grangelGroup{ position:absolute; inset:0; z-index:25; pointer-events:none; }

  /* Character-select sidebar */
  #charOverlay{ position:absolute; inset:0; background:rgba(60,46,38,.35); z-index:29; display:flex; align-items:center; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  #charOverlay.show{ opacity:1; pointer-events:auto; }
  #charSidebar{ width:min(280px,80vw); height:100%; background:var(--panel); box-shadow:6px 0 24px rgba(0,0,0,.2); padding:26px 20px; display:flex; flex-direction:column; gap:16px; transform:translateX(-100%); transition:transform .3s ease; }
  #charOverlay.show #charSidebar{ transform:translateX(0); }
  #charSidebar h2{ margin:0; font-size:19px; color:var(--ink); }
  #charSidebar p{ margin:0; font-size:13px; color:var(--ink); opacity:.75; }
  .char-choice{ background:#fff; border:3px solid transparent; border-radius:16px; padding:14px; display:flex; align-items:center; gap:12px; cursor:pointer; font-size:15px; color:var(--ink); font-weight:700; box-shadow:0 3px 8px rgba(0,0,0,.1); transition:transform .15s ease, border-color .15s ease; }
  .char-choice:hover{ transform:translateY(-2px); }
  .char-choice.selected{ border-color:var(--heart); }
  .char-choice .thumb{ width:34px; height:51px; object-fit:contain; }
  .char-choice:focus-visible{ outline:3px solid var(--heart); outline-offset:2px; }

  #player{ position:absolute; width:60px; height:90px; object-fit:contain; z-index:8; filter:drop-shadow(0 6px 6px rgba(0,0,0,.25)); user-select:none; display:none; }
  #player.active{ display:flex; }
  #player-shadow{ position:absolute; width:44px; height:12px; background:rgba(0,0,0,.18); border-radius:50%; filter:blur(2px); z-index:7; display:none; }
  #player-shadow.active{ display:block; }

  #charBtn{ position:fixed; bottom:16px; left:16px; z-index:20; }
</style>
</head>
<body>
  <div id="stage">
    <div class="sky"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="ground"></div>
    <div class="bush b1"></div><div class="bush b2"></div><div class="bush b3"></div>
    <div class="bush b4"></div><div class="bush b5"></div><div class="bush b6"></div>
    <svg id="roads"></svg>
    <div class="pond">
      <span class="ripple"></span>
      <svg class="duck" viewBox="0 0 64 50" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="30" cy="34" rx="22" ry="14" fill="#f4d35e"/>
        <circle cx="46" cy="18" r="12" fill="#f4d35e"/>
        <path d="M56 16 L66 19 L56 22 Z" fill="#e07a3f"/>
        <circle cx="49" cy="15" r="2" fill="#3a2b28"/>
        <path d="M12 30 Q24 20 36 29" fill="none" stroke="#e0b84a" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="tree t1"><div class="canopy"></div><div class="trunk"></div></div>
    <div class="tree t2"><div class="canopy"></div><div class="trunk"></div></div>
    <div class="tree t3"><div class="canopy"></div><div class="trunk"></div></div>
    <div id="cottage">
      <div class="chimney"></div>
      <div class="roof"></div>
      <div class="fascia"></div>
      <div class="body"></div>
      <div class="foundation"></div>
      <div class="flowerbox fbL"><span class="flower f-a"></span><span class="flower f-c"></span></div>
      <div class="flowerbox fbR"><span class="flower f-b"></span><span class="flower f-a"></span></div>
      <div class="window wL"></div>
      <div class="window wR"></div>
      <div class="door"></div>
    </div>
    <div class="flowers fl1"><span class="flower f-a"></span><span class="flower f-c"></span><span class="flower f-b"></span></div>
    <div class="flowers fl2"><span class="flower f-b"></span><span class="flower f-a"></span></div>
    <div class="flowers fl3"><span class="flower f-c"></span><span class="flower f-a"></span><span class="flower f-b"></span></div>

    <div id="grangelGroup">
      <div id="grangel-shadow"></div>
      <img id="grangel" src="gram_grangel.png" alt="GrAngel, a friendly waving heart" />
      <div id="bubble">Hi there. I'm glad you're here. 💛</div>
    </div>

    <div id="player-shadow"></div>
    <img id="player" alt="Your character" />
    <button id="roadPrompt"></button>
    <div id="toast"></div>

    <div id="topbar">
      <div id="tag">One <b>connected</b> village · tap the GrAngel</div>
      <div class="btnrow">
        <!-- This link opens the map page -->
        <a href="map.html" id="openMap">🗺️ <span>Open Map</span></a>
        <button id="btnSound" class="icon-btn" title="Sound on/off" aria-label="Toggle sound">🔊</button>
        <button id="btnMotion" class="icon-btn" title="Reduce motion" aria-label="Toggle reduced motion">🌿</button>
      </div>
    </div>

    <button id="charBtn" class="icon-btn" title="Choose your character" aria-label="Choose your character">🧑</button>
  </div>

  <div id="charOverlay">
    <div id="charSidebar">
      <h2>Choose your character</h2>
      <p>Pick who explores the village, then use W A S D to walk around.</p>
      <button class="char-choice" data-char="boy"><img class="thumb" src="boy.png" alt="" /> Boy</button>
      <button class="char-choice" data-char="girl"><img class="thumb" src="girl.png" alt="" /> Girl</button>
    </div>
  </div>

<script>
  const grangel=document.getElementById('grangel');
  const bubble=document.getElementById('bubble');
  const stage=document.getElementById('stage');
  const lines=[
    "Hi there. I'm glad you're here. 💛",
    "Tap Open Map to see all our places!",
    "This whole village is one calm place.",
    "Take your time. There's no rush here.",
    "Every path here leads somewhere kind."
  ];
  // Sound + reduced motion are shared with the other pages through localStorage
  // ('grangelSound' / 'grangelMotion'); with no saved choice, motion follows the device setting.
  const store={
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };
  let i=0, soundOn=store.get('grangelSound')!=='off';
  function spawnHeart(x,y){ const h=document.createElement('div'); h.className='heart'; h.style.left=x+'px'; h.style.top=y+'px'; h.style.animation='floatup 2.2s ease-out forwards'; stage.appendChild(h); setTimeout(()=>h.remove(),2300); }
  function chime(){ if(!soundOn) return; try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); [523.25,659.25].forEach((f,idx)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(ctx.destination); const t=ctx.currentTime+idx*0.12; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.15,t+0.03); g.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.start(t); o.stop(t+0.42); }); }catch(e){} }
  function greet(){ i=(i+1)%lines.length; bubble.textContent=lines[i]; bubble.classList.add('show'); chime(); const r=grangel.getBoundingClientRect(); spawnHeart(r.left+r.width/2, r.top+10); clearTimeout(greet._t); greet._t=setTimeout(()=>bubble.classList.remove('show'),3200); }
  grangel.addEventListener('click',greet);
  grangel.setAttribute('tabindex','0');
  grangel.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') greet(); });
  const btnSound=document.getElementById('btnSound'), btnMotion=document.getElementById('btnMotion');
  const savedMotion=store.get('grangelMotion');
  if(savedMotion ? savedMotion==='reduced' : window.matchMedia('(prefers-reduced-motion: reduce)').matches){ document.body.classList.add('reduced'); }
  function showControls(){
    btnSound.textContent=soundOn?'🔊':'🔇'; btnSound.setAttribute('aria-pressed', String(soundOn));
    const r=document.body.classList.contains('reduced');
    btnMotion.textContent=r?'🍃':'🌿'; btnMotion.setAttribute('aria-pressed', String(r));
  }
  btnSound.addEventListener('click',()=>{ soundOn=!soundOn; store.set('grangelSound', soundOn?'on':'off'); showControls(); });
  btnMotion.addEventListener('click',()=>{ const r=document.body.classList.toggle('reduced'); store.set('grangelMotion', r?'reduced':'full'); showControls(); });
  showControls();

  /* ============================================================
     ROADS — 5 brick roads fanning out from the cottage doorstep,
     matching Home's 5 direct connections on the map. Each road's
     end is given as a fraction of the screen (off-screen past an
     edge), so the layout scales with the window; rebuilt on resize.
     ============================================================ */
  const ROADS=[
    { id:'feelwell',   icon:'🌸', name:'FeelWell Garden',         end:{ x:-0.05, y:0.63 }, bow: 0.5 },
    { id:'creativity', icon:'🎨', name:'Creativity Cottage',      end:{ x:0.14,  y:1.06 }, bow: 1, page:'creativity-cottage.html', sign:'inner' },
    { id:'writing',    icon:'✏️', name:'The Writing Studio',      end:{ x:0.50,  y:1.06 }, bow: 0.4, sign:'right' },
    { id:'superpower', icon:'⚡', name:'Superpower Zone',         end:{ x:0.86,  y:1.06 }, bow:-1   },
    { id:'courtyard',  icon:'🏡', name:"Grandparents' Courtyard", end:{ x:1.05,  y:0.63 }, bow:-0.5 },
  ];
  const toast=document.getElementById('toast');
  function travel(r){
    if(r.page){ window.location.href=r.page; return; }
    toast.textContent=`${r.name} is coming soon 💛`;
    toast.classList.add('show');
    clearTimeout(travel._t);
    travel._t=setTimeout(()=>toast.classList.remove('show'),2400);
  }

  const SVGNS='http://www.w3.org/2000/svg';
  const roadsSvg=document.getElementById('roads');
  const MORTAR='#dcc39c', CURB='#b39a72';
  const BRICK_TONES=['#c98d84','#b97a68','#c0806f'];
  const EDGE_BLOOMS=['#d98fb0','#b79ad6','#e7c877','#fff4f8'];

  function depthScale(y, h){
    const horizon=h*0.46, near=h*1.0;
    const t=Math.max(0, Math.min(1, (y-horizon)/(near-horizon)));
    return 0.42 + 0.58*t;
  }
  function quadPoint(p0,p1,p2,t){ const it=1-t; return { x: it*it*p0.x+2*it*t*p1.x+t*t*p2.x, y: it*it*p0.y+2*it*t*p1.y+t*t*p2.y }; }
  function quadTangent(p0,p1,p2,t){
    const it=1-t;
    const dx=2*it*(p1.x-p0.x)+2*t*(p2.x-p1.x);
    const dy=2*it*(p1.y-p0.y)+2*t*(p2.y-p1.y);
    const len=Math.hypot(dx,dy)||1;
    return { x:dx/len, y:dy/len };
  }
  function svgEl(tag, attrs){ const el=document.createElementNS(SVGNS,tag); for(const k in attrs) el.setAttribute(k,attrs[k]); return el; }

  // One road: mortar ribbon + running-bond bricks (clipped to the ribbon), a soft
  // curb outline, and little flowers along both edges. Returns its samples so the
  // signpost and the end-of-road prompt can be placed along it.
  function buildRoad(start, end, bowSign, h, idx){
    const dx=end.x-start.x, dy=end.y-start.y;
    const dist=Math.hypot(dx,dy);
    const nx=-dy/dist, ny=dx/dist;
    const amp=dist*0.10*bowSign;
    const ctrl={ x:(start.x+end.x)/2+nx*amp, y:(start.y+end.y)/2+ny*amp };

    const ROAD_W_BASE=80;
    const SAMPLES=Math.max(30, Math.round(dist/12));
    const centre=[], tangent=[], scale=[];
    for(let i=0;i<=SAMPLES;i++){
      const t=i/SAMPLES;
      const c=quadPoint(start,ctrl,end,t);
      centre.push(c); tangent.push(quadTangent(start,ctrl,end,t)); scale.push(depthScale(c.y,h));
    }
    const arc=[0];
    for(let i=1;i<centre.length;i++) arc.push(arc[i-1]+Math.hypot(centre[i].x-centre[i-1].x, centre[i].y-centre[i-1].y));
    const totalLen=arc[arc.length-1];
    const at=s=>{ let i=0; while(i<arc.length-1 && arc[i]<s) i++; return i; };

    const left=[], right=[];
    centre.forEach((c,i)=>{
      const tg=tangent[i], half=(ROAD_W_BASE*scale[i])/2;
      left.push({ x:c.x-tg.y*half, y:c.y+tg.x*half });
      right.push({ x:c.x+tg.y*half, y:c.y-tg.x*half });
    });
    let d=`M ${left[0].x},${left[0].y} `;
    left.slice(1).forEach(p=>d+=`L ${p.x},${p.y} `);
    right.slice().reverse().forEach(p=>d+=`L ${p.x},${p.y} `);
    d+='Z';

    const clipId=`road-clip-${idx}`;
    const clip=svgEl('clipPath',{ id:clipId });
    clip.appendChild(svgEl('path',{ d }));
    roadsSvg.appendChild(clip);

    const group=svgEl('g',{ 'clip-path':`url(#${clipId})` });
    group.appendChild(svgEl('path',{ d, fill:MORTAR }));
    const BRICK_LEN_BASE=42, GAP=4, laneCount=2;
    let rowIndex=0, coveredLen=0, tone=idx;
    while(coveredLen < totalLen+BRICK_LEN_BASE){
      const stagger=(rowIndex%2===0)?0:BRICK_LEN_BASE/2;
      const i=at(Math.max(0, Math.min(totalLen, coveredLen+BRICK_LEN_BASE/2-stagger)));
      const c=centre[i], tg=tangent[i], sc=scale[i];
      const angle=Math.atan2(tg.y,tg.x)*180/Math.PI;
      const roadW=ROAD_W_BASE*sc, half=roadW/2;
      const laneW=(roadW-GAP*(laneCount+1))/laneCount;
      const brickLen=BRICK_LEN_BASE*sc;
      for(let lane=0; lane<laneCount; lane++){
        const off=-half+GAP+laneW/2+lane*(laneW+GAP);
        group.appendChild(svgEl('rect',{
          x:-(brickLen-GAP)/2, y:-(laneW-GAP)/2,
          width:Math.max(2,brickLen-GAP), height:Math.max(2,laneW-GAP), rx:3,
          fill:BRICK_TONES[tone%BRICK_TONES.length], stroke:'rgba(90,58,40,.25)', 'stroke-width':1,
          transform:`translate(${c.x-tg.y*off},${c.y+tg.x*off}) rotate(${angle})`
        }));
        tone++;
      }
      coveredLen += BRICK_LEN_BASE;
      rowIndex++;
    }
    roadsSvg.appendChild(group);
    roadsSvg.appendChild(svgEl('path',{ d, fill:'none', stroke:CURB, 'stroke-width':2.5, 'stroke-linejoin':'round', opacity:.8 }));

    // Flowers along both edges, starting clear of the plaza so they never sit on a neighbour road.
    let side=1, k=idx;
    for(let s=120; s<totalLen-10; s+=26){
      const i=at(s), c=centre[i], tg=tangent[i], sc=scale[i];
      const off=side*((ROAD_W_BASE*sc)/2 + 9*sc);
      const fx=c.x-tg.y*off, fy=c.y+tg.x*off;
      roadsSvg.appendChild(svgEl('ellipse',{ cx:fx-3*sc, cy:fy+4*sc, rx:5*sc, ry:2.4*sc, fill:'#6a9a58', transform:`rotate(-25 ${fx-3*sc} ${fy+4*sc})` }));
      roadsSvg.appendChild(svgEl('ellipse',{ cx:fx+3*sc, cy:fy+4*sc, rx:5*sc, ry:2.4*sc, fill:'#5f8f52', transform:`rotate(25 ${fx+3*sc} ${fy+4*sc})` }));
      roadsSvg.appendChild(svgEl('circle',{ cx:fx, cy:fy, r:5.5*sc, fill:EDGE_BLOOMS[k%EDGE_BLOOMS.length], stroke:'rgba(90,58,40,.15)', 'stroke-width':1 }));
      roadsSvg.appendChild(svgEl('circle',{ cx:fx, cy:fy, r:2*sc, fill:'#f6c94c' }));
      side=-side; k++;
    }
    return { centre, tangent, scale, arc, totalLen, at };
  }

  // Signposts are created once; buildRoads() only moves them.
  const roadEls=ROADS.map(r=>{
    const el=document.createElement('div');
    el.className='roadsign';
    el.setAttribute('role','button');
    el.setAttribute('tabindex','0');
    el.setAttribute('aria-label', `Go to ${r.name}`);
    el.innerHTML=`<div class="post"></div><div class="plank">${r.icon} ${r.name}</div>`;
    el.addEventListener('click', ()=>travel(r));
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') travel(r); });
    stage.appendChild(el);
    return { ...r, el, exit:null };
  });

  function buildRoads(){
    const w=stage.clientWidth, h=stage.clientHeight;
    roadsSvg.setAttribute('width', w);
    roadsSvg.setAttribute('height', h);
    roadsSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    roadsSvg.innerHTML='';
    const door={ x:w*0.5, y:h*0.70 }; // the cottage sits at bottom:30%, so its door meets the grass here
    roadEls.forEach((r,idx)=>{
      const road=buildRoad(door, { x:r.end.x*w, y:r.end.y*h }, r.bow, h, idx);

      // Signpost beside the road, a bit past halfway: on the upper side of a
      // sideways road; beside a road heading down the screen, on the outer side
      // unless the road says otherwise ('inner' keeps it off the pond).
      const i=road.at(road.totalLen*0.55), c=road.centre[i], tg=road.tangent[i];
      let sx=-tg.y, sy=tg.x; // unit normal
      const downward=Math.abs(tg.y)>0.7 || !!r.sign;
      if(downward){
        const want = r.sign==='right' ? 1 : r.sign==='inner' ? Math.sign(door.x-c.x) : Math.sign(c.x-door.x);
        if(sx*want<0){ sx=-sx; sy=-sy; }
      }
      else if(sy>0){ sx=-sx; sy=-sy; }
      // A road heading down the screen gets its sign well off to the side, so the plank clears the bricks.
      const off=(80*road.scale[i])/2+(downward ? 24+r.name.length*3.6 : 14);
      r.el.style.left=Math.min(w-90, Math.max(90, c.x+sx*off))+'px';
      r.el.style.top=Math.min(h-12, c.y+sy*off+(downward ? 40 : 0))+'px';

      r.road=road;

      // Exit point: the last spot on the road the player can actually reach.
      const b=groundBounds();
      for(let j=road.centre.length-1; j>=0; j--){
        const p=road.centre[j];
        if(p.x>=b.minX+10 && p.x<=b.maxX-10 && p.y>=b.minY && p.y<=b.maxY-10){ r.exit=p; break; }
      }
    });

    // A little round plaza at the doorstep, laid over the five road ends so they join neatly.
    const sc=depthScale(door.y,h);
    roadsSvg.appendChild(svgEl('ellipse',{ cx:door.x, cy:door.y+6, rx:96*sc+6, ry:34*sc+4, fill:MORTAR, stroke:CURB, 'stroke-width':2.5 }));
    roadsSvg.appendChild(svgEl('ellipse',{ cx:door.x, cy:door.y+6, rx:70*sc, ry:24*sc, fill:'none', stroke:BRICK_TONES[0], 'stroke-width':10*sc, 'stroke-dasharray':`${16*sc} ${4*sc}` }));
    roadsSvg.appendChild(svgEl('ellipse',{ cx:door.x, cy:door.y+6, rx:38*sc, ry:13*sc, fill:BRICK_TONES[1], opacity:.85 }));

    placePond(w, h);
  }

  // The pond sits in the open grass left of the Creativity road (and below the FeelWell
  // road), sized to fit that gap so it never ends up on a road at any window size.
  const pond=document.querySelector('.pond');
  function placePond(w, h){
    const road=roadEls.find(r=>r.id==='creativity').road;
    const cy=h*0.80;
    let i=0;
    road.centre.forEach((c,j)=>{ if(Math.abs(c.y-cy)<Math.abs(road.centre[i].y-cy)) i=j; });
    const roadLeft=road.centre[i].x-(80*road.scale[i])/2-24; // road edge, minus room for its flowers
    const pw=Math.max(90, Math.min(210, roadLeft-28));
    const ph=pw*0.44;
    pond.style.width=pw+'px'; pond.style.height=ph+'px';
    pond.style.left=Math.max(12, (roadLeft-pw)/2)+'px';
    pond.style.top=(cy-ph/2)+'px'; pond.style.bottom='auto';
    pond.style.setProperty('--swim', Math.max(20, pw-80)+'px');
    // its little flower patch grows just below the water's edge
    const fl=document.querySelector('.flowers.fl3');
    fl.style.left=(parseFloat(pond.style.left)+pw*0.55)+'px';
    fl.style.top=(cy+ph/2+4)+'px'; fl.style.bottom='auto';
  }

  // Walking to a road's far end shows a "Go to…" button above the player.
  const roadPrompt=document.getElementById('roadPrompt');
  let promptRoad=null;
  function updateRoadPrompt(){
    promptRoad=null;
    let best=110;
    roadEls.forEach(r=>{
      const d=r.exit ? Math.hypot(px.x-r.exit.x, px.y-r.exit.y) : Infinity;
      r.el.classList.toggle('near', d<110);
      if(d<best){ best=d; promptRoad=r; }
    });
    if(promptRoad){
      roadPrompt.textContent=`${promptRoad.icon} Go to ${promptRoad.name} →`;
      roadPrompt.style.left=Math.min(window.innerWidth-150, Math.max(150, px.x))+'px';
      roadPrompt.style.top=Math.max(60, px.y-56)+'px';
      roadPrompt.classList.add('show');
    } else {
      roadPrompt.classList.remove('show');
    }
  }
  roadPrompt.addEventListener('click', ()=>{ if(promptRoad) travel(promptRoad); });
  window.addEventListener('keydown', e=>{ if(e.key==='Enter' && promptRoad && document.activeElement===document.body) travel(promptRoad); });

  buildRoads();
  // Watch the stage itself (not just window resize) so the roads always match the scene's real size.
  let roadsResizeTimer;
  new ResizeObserver(()=>{
    clearTimeout(roadsResizeTimer);
    roadsResizeTimer=setTimeout(()=>{ buildRoads(); updateRoadPrompt(); },150);
  }).observe(stage);

  /* ============================================================
     PLAYABLE CHARACTER — pick boy/girl in the sidebar, then walk
     around the village with W A S D (arrow keys also work).
     ============================================================ */
  const CHAR_SRC={ boy:'boy.png', girl:'girl.png' };
  const charOverlay=document.getElementById('charOverlay');
  const charBtn=document.getElementById('charBtn');
  const player=document.getElementById('player');
  const playerShadow=document.getElementById('player-shadow');
  const choices=[...document.querySelectorAll('.char-choice')];

  function openCharPicker(){ charOverlay.classList.add('show'); }
  function closeCharPicker(){ charOverlay.classList.remove('show'); }

  const px={ x: Math.round(window.innerWidth*0.45), y: Math.round(window.innerHeight*0.7) };
  function groundBounds(){
    return { minX:30, maxX:window.innerWidth-30, minY:window.innerHeight*0.5, maxY:window.innerHeight-24 };
  }
  function placePlayer(){
    player.style.left=(px.x-30)+'px'; player.style.top=(px.y-45)+'px';
    playerShadow.style.left=(px.x-22)+'px'; playerShadow.style.top=(px.y+38)+'px';
  }

  function selectChar(kind){
    player.src=CHAR_SRC[kind]||CHAR_SRC.boy;
    player.classList.add('active'); playerShadow.classList.add('active');
    choices.forEach(c=>c.classList.toggle('selected', c.dataset.char===kind));
    localStorage.setItem('grangelChar', kind);
    placePlayer();
    closeCharPicker();
  }

  choices.forEach(btn=>btn.addEventListener('click',()=>selectChar(btn.dataset.char)));
  charBtn.addEventListener('click', openCharPicker);

  const savedChar=localStorage.getItem('grangelChar');
  if(savedChar && CHAR_SRC[savedChar]){ selectChar(savedChar); } else { openCharPicker(); }

  // Movement loop
  const keys=new Set();
  window.addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys.add(k); e.preventDefault(); }
  });
  window.addEventListener('keyup', e=>{ keys.delete(e.key.toLowerCase()); });

  // GrAngel tags along with the player, staying a small diagonal step up-left of it —
  // ALWAYS: every frame we compute GrAngel's position directly from the player's
  // current (already-clamped) position, rather than accumulating a delta each step.
  // That accumulation was the earlier bug: it nudged GrAngel by the *intended* movement
  // even on frames where the player was stuck against a wall and didn't actually move,
  // so the two would drift apart. Deriving the position fresh each time makes that
  // impossible — GrAngel is mathematically always exactly at (player + gap).
  const grangelGroup=document.getElementById('grangelGroup');
  const GRANGEL_GAP={ x:-70, y:-70 }; // ~1 inch, diagonally up-left of the character
  let grangelHome=null;
  function updateGrangelPosition(){
    grangelGroup.style.transform=`translate(${px.x+GRANGEL_GAP.x-grangelHome.x}px, ${px.y+GRANGEL_GAP.y-grangelHome.y}px)`;
  }
  function captureGrangelHome(){
    const r=grangel.getBoundingClientRect();
    grangelHome={ x:r.left+r.width/2, y:r.top+r.height/2 };
    updateGrangelPosition();
  }
  captureGrangelHome();

  updateRoadPrompt();

  const SPEED=4;
  function tick(){
    if(player.classList.contains('active')){
      let dx=0, dy=0;
      if(keys.has('w')||keys.has('arrowup')) dy-=1;
      if(keys.has('s')||keys.has('arrowdown')) dy+=1;
      if(keys.has('a')||keys.has('arrowleft')){ dx-=1; player.style.transform='scaleX(-1)'; }
      if(keys.has('d')||keys.has('arrowright')){ dx+=1; player.style.transform='scaleX(1)'; }
      if(dx||dy){
        const len=Math.hypot(dx,dy)||1;
        const b=groundBounds();
        px.x=Math.min(b.maxX,Math.max(b.minX, px.x+(dx/len)*SPEED));
        px.y=Math.min(b.maxY,Math.max(b.minY, px.y+(dy/len)*SPEED));
        placePlayer();
        updateRoadPrompt();
        updateGrangelPosition();
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
